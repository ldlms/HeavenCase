services:

  heavencase:
    container_name: heaven_case
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/heavencase
      PORT: 3000
      RUST_LOG: info,tower_http=debug
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: shop-postgres
    environment:
      POSTGRES_DB: heavencase
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d heavencase"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: