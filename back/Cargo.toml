[package]
name = "heaven_case"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
routes = "0.1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid"] }
utoipa = { version = "5", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "hostname"] }
sha2 = "0.11.1"
hex = "0.4.3"
uuid = { version = "1.29.0", features = ["serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
password-auth = "1"
cookie = "0.18.2"
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
