# Lint and build the front-end.

name: Front CI

on:
  pull_request:
    branches:
      - master
      - dev
    paths:
      - "front/**"
      - ".github/workflows/front-ci.yml"

permissions:
  contents: read

jobs:
  front-ci:
    name: front-ci
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
